<path d="M520 478V508" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<path d="M520 572V608" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<path d="M520 672V708" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<path d="M520 772V802" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<path d="M520 898V928" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<path d="M520 992V1028" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<path d="M520 1092V1128" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<path d="M520 1192V1222" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<path d="M520 1422V1468" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<text x="544" y="500.0" text-anchor="middle" font-size="12" fill="#172338">Sí</text>
<text x="544" y="917.0" text-anchor="middle" font-size="12" fill="#172338">Sí</text>
<path d="M520 1532V1717" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<text x="535" y="1660" font-size="13" fill="#64748B">Cerrar</text>
<rect x="850.0" y="398.0" width="360" height="64" rx="13" fill="#FFF0F2" stroke="#EDC7CF"/>
<text x="1030" y="424.5" text-anchor="middle" font-size="15" fill="#172338">Mostrar el error de entrada</text>
<text x="1030" y="445.5" text-anchor="middle" font-size="15" fill="#172338">y permitir corregir</text>
<path d="M710 430H850" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<text x="765" y="420" font-size="13" fill="#64748B">No</text>
<path d="M1030 398V320H715" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<text x="1050" y="355" font-size="13" fill="#64748B">Corregir</text>
<rect x="850.0" y="818.0" width="360" height="64" rx="13" fill="#FFF0F2" stroke="#EDC7CF"/>
<text x="1030" y="844.5" text-anchor="middle" font-size="15" fill="#172338">Informar sistema inválido</text>
<text x="1030" y="865.5" text-anchor="middle" font-size="15" fill="#172338">y revisar los datos</text>
<path d="M710 850H850" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<text x="765" y="840" font-size="13" fill="#64748B">No</text>
<path d="M1210 850H1260V320H1210" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<text x="1040" y="785" font-size="13" fill="#64748B">Volver a la entrada</text>
<path d="M1210 320H715" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<rect x="850.0" y="1205.0" width="360" height="50" rx="13" fill="#E9F5F4" stroke="#A8D2CE"/>
<text x="1030" y="1235.0" text-anchor="middle" font-size="15" fill="#172338">Estado: Verificado</text>
<rect x="850.0" y="1305.0" width="360" height="50" rx="13" fill="#FFF0F2" stroke="#EDC7CF"/>
<text x="1030" y="1335.0" text-anchor="middle" font-size="15" fill="#172338">Estado: Revisar precisión</text>
<path d="M710 1270H790V1230H850" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<text x="762" y="1250" font-size="13" fill="#64748B">Sí</text>
<path d="M520 1318V1330H850" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<text x="760" y="1320" font-size="13" fill="#64748B">No</text>
<path d="M1210 1230H1260V1390H715" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<path d="M1030 1355V1390H715" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<rect x="850.0" y="1448.0" width="360" height="64" rx="13" fill="#FFFFFF" stroke="#D5DDE9"/>
<text x="1030" y="1474.5" text-anchor="middle" font-size="15" fill="#172338">Evaluar x dentro del dominio</text>
<text x="1030" y="1495.5" text-anchor="middle" font-size="15" fill="#172338">Mostrar valor, tramo y derivadas</text>
<rect x="850.0" y="1548.0" width="360" height="64" rx="13" fill="#FFFFFF" stroke="#D5DDE9"/>
<text x="1030" y="1574.5" text-anchor="middle" font-size="15" fill="#172338">Exportar informe TXT</text>
<text x="1030" y="1595.5" text-anchor="middle" font-size="15" fill="#172338">o gráfica vectorial SVG</text>
<path d="M715 1500H790V1480H850" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<text x="750" y="1465" font-size="13" fill="#64748B">Evaluar</text>
<path d="M790 1500V1580H850" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<text x="790" y="1550" font-size="13" fill="#64748B">Exportar</text>
<path d="M1210 1480H1260V1660H740V1525H715" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<path d="M1210 1580H1260V1660H740V1525H715" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<rect x="15.0" y="1456.0" width="240" height="88" rx="13" fill="#FFFFFF" stroke="#D5DDE9"/>
<text x="135" y="1484.0" text-anchor="middle" font-size="15" fill="#172338">Modificar datos</text>
<text x="135" y="1505.0" text-anchor="middle" font-size="15" fill="#172338">Invalidar resultados</text>
<text x="135" y="1526.0" text-anchor="middle" font-size="15" fill="#172338">y volver a calcular</text>
<path d="M325 1500H255" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<text x="265" y="1488" font-size="13" fill="#64748B">Editar</text>
<path d="M135 1456V320H325" fill="none" stroke="#8191AB" stroke-width="1.7" marker-end="url(#flecha)"/>
<text x="70" y="1800" font-size="13" fill="#64748B">En una consulta fuera del dominio se muestra un mensaje y se conserva el spline calculado.</text>
</g></svg>