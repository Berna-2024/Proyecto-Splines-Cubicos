<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1840" viewBox="0 0 1340 1840" role="img">
<title>Diagrama de flujo de SplineLab</title>
<defs><marker id="flecha" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#8191AB"/></marker></defs>
<rect width="1340" height="1840" fill="#F4F6FA"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#172338">
<text x="70" y="55" font-size="29" font-weight="bold">Del punto a la curva</text>
<text x="70" y="85" font-size="15" fill="#64748B">SplineLab · Flujo del cálculo natural, verificación y exploración de resultados</text>
<rect x="430.0" y="119.0" width="180" height="42" rx="21" fill="#EAE6F8" stroke="#D5DDE9"/>
<text x="520" y="145.0" text-anchor="middle" font-size="15" fill="#172338">INICIO</text>
<rect x="325.0" y="188.0" width="390" height="64" rx="13" fill="#FFFFFF" stroke="#D5DDE9"/>
<text x="520" y="225.0" text-anchor="middle" font-size="15" fill="#172338">Mostrar interfaz y ejemplo inicial</text>
<rect x="325.0" y="288.0" width="390" height="64" rx="13" fill="#FFFFFF" stroke="#D5DDE9"/>
<text x="520" y="314.5" text-anchor="middle" font-size="15" fill="#172338">Ingresar puntos, cargar ejemplo</text>
<text x="520" y="335.5" text-anchor="middle" font-size="15" fill="#172338">o importar un archivo CSV</text>
<path d="M520 382L710 430L520 478L330 430Z" fill="#F0ECFA" stroke="#BFB3E1"/>
<text x="520" y="423.5" text-anchor="middle" font-size="14" fill="#172338">¿2 a 80 puntos finitos</text>
<text x="520" y="444.5" text-anchor="middle" font-size="14" fill="#172338">y x estrictamente creciente?</text>
<rect x="325.0" y="508.0" width="390" height="64" rx="13" fill="#FFFFFF" stroke="#D5DDE9"/>
<text x="520" y="545.0" text-anchor="middle" font-size="15" fill="#172338">Calcular distancias h y pendientes m</text>
<rect x="325.0" y="608.0" width="390" height="64" rx="13" fill="#FFFFFF" stroke="#D5DDE9"/>
<text x="520" y="634.5" text-anchor="middle" font-size="15" fill="#172338">Construir A·M = B</text>
<text x="520" y="655.5" text-anchor="middle" font-size="15" fill="#172338">Frontera natural: M inicial = M final = 0</text>
<rect x="325.0" y="708.0" width="390" height="64" rx="13" fill="#FFFFFF" stroke="#D5DDE9"/>
<text x="520" y="734.5" text-anchor="middle" font-size="15" fill="#172338">Eliminación de Gauss</text>
<text x="520" y="755.5" text-anchor="middle" font-size="15" fill="#172338">con pivoteo parcial escalado</text>
<path d="M520 802L710 850L520 898L330 850Z" fill="#F0ECFA" stroke="#BFB3E1"/>
<text x="520" y="854.0" text-anchor="middle" font-size="14" fill="#172338">¿Sistema resoluble?</text>
<rect x="325.0" y="928.0" width="390" height="64" rx="13" fill="#FFFFFF" stroke="#D5DDE9"/>
<text x="520" y="954.5" text-anchor="middle" font-size="15" fill="#172338">Sustitución regresiva</text>
<text x="520" y="975.5" text-anchor="middle" font-size="15" fill="#172338">Obtener segundas derivadas M</text>
<rect x="325.0" y="1028.0" width="390" height="64" rx="13" fill="#FFFFFF" stroke="#D5DDE9"/>
<text x="520" y="1065.0" text-anchor="middle" font-size="15" fill="#172338">Calcular a, b, c y d por intervalo</text>
<rect x="325.0" y="1128.0" width="390" height="64" rx="13" fill="#FFFFFF" stroke="#D5DDE9"/>
<text x="520" y="1154.5" text-anchor="middle" font-size="15" fill="#172338">Comprobar interpolación, continuidad,</text>
<text x="520" y="1175.5" text-anchor="middle" font-size="15" fill="#172338">fronteras naturales y residuo del sistema</text>
<path d="M520 1222L710 1270L520 1318L330 1270Z" fill="#F0ECFA" stroke="#BFB3E1"/>
<text x="520" y="1274.0" text-anchor="middle" font-size="14" fill="#172338">¿Cumple la tolerancia?</text>
<rect x="325.0" y="1358.0" width="390" height="64" rx="13" fill="#FFFFFF" stroke="#D5DDE9"/>
<text x="520" y="1384.5" text-anchor="middle" font-size="15" fill="#172338">Mostrar curva, polinomios,</text>
<text x="520" y="1405.5" text-anchor="middle" font-size="15" fill="#172338">procedimiento y estado de validación</text>
<rect x="325.0" y="1468.0" width="390" height="64" rx="13" fill="#E9F5F4" stroke="#A8D2CE"/>
<text x="520" y="1505.0" text-anchor="middle" font-size="15" fill="#172338">Explorar resultados o cambiar datos</text>
<rect x="385.0" y="1717.0" width="270" height="46" rx="23" fill="#EAE6F8" stroke="#D5DDE9"/>
<text x="520" y="1745.0" text-anchor="middle" font-size="15" fill="#172338">Cerrar aplicación · FIN</text>
